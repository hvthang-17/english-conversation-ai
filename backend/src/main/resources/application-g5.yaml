spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/english_conversation?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    target: 15
app:
  features:
    stage: ${APP_FEATURES_STAGE:PRONUNCIATION}
  gemini:
    enabled: false
  mail:
    reminders-enabled: false
  listening:
    audio-directory: ${LISTENING_AUDIO_DIRECTORY:.runtime/listening}
    azure:
      enabled: ${LISTENING_AZURE_ENABLED:false}
      key: ${AZURE_SPEECH_KEY:}
      region: ${AZURE_SPEECH_REGION:}
  pronunciation:
    audio-directory: ${PRONUNCIATION_AUDIO_DIRECTORY:../.runtime/pronunciation}
    fingerprint-key: ${PRONUNCIATION_FINGERPRINT_KEY:}
    daily-request-limit: ${PRONUNCIATION_DAILY_REQUEST_LIMIT:6}
    provider-daily-limit: ${PRONUNCIATION_PROVIDER_DAILY_LIMIT:6}
    azure:
      enabled: ${PRONUNCIATION_AZURE_ENABLED:false}
      key: ${AZURE_SPEECH_KEY:}
      region: ${AZURE_SPEECH_REGION:}
