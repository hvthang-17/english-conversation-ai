spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/english_conversation?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
  flyway:
    enabled: true
    target: 5
    locations: classpath:db/migration
    baseline-on-migrate: false
app:
  features:
    stage: ${APP_FEATURES_STAGE:ACCOUNT}
  gemini:
    enabled: false
  mail:
    reminders-enabled: false
