spring:
  profiles:
    default: bootstrap
  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:./.env[.properties]"
  task:
    scheduling:
      pool:
        size: 4
  application:
    name: english-conversation-ai
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/english_conversation?connectionTimeZone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:english_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 * * * * *"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
      file-size-threshold: 2MB
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SESSION
        path: /
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never

app:
  account:
    avatar-directory: ${AVATAR_DIRECTORY:.runtime/avatars}
    cleanup-ms: ${ACCOUNT_CLEANUP_MS:300000}
  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    starttls: ${MAIL_STARTTLS:true}
    public-url: ${APP_PUBLIC_URL:http://localhost:5173}
    outbox-key: ${MAIL_OUTBOX_KEY:}
    poll-ms: ${MAIL_POLL_MS:60000}
  voice:
    temp-directory: ${VOICE_TEMP_DIRECTORY:.runtime/voice}
    raw-ttl-seconds: ${VOICE_RAW_TTL_SECONDS:3600}
    draft-ttl-seconds: ${VOICE_DRAFT_TTL_SECONDS:1800}
    cleanup-delay-ms: ${VOICE_CLEANUP_DELAY_MS:300000}
  gemini:
    enabled: ${GEMINI_CHAT_ENABLED:false}
  chat:
    total-attempt-limit: ${CHAT_TOTAL_ATTEMPT_LIMIT:0}
    global-rpm: ${CHAT_GLOBAL_RPM:10}
    user-rpm: ${CHAT_USER_RPM:6}
    global-concurrent: ${CHAT_GLOBAL_CONCURRENT:2}
    timeout-seconds: ${CHAT_TIMEOUT_SECONDS:30}
    max-attempts: ${CHAT_MAX_ATTEMPTS:2}
    input-limit: ${CHAT_INPUT_LIMIT:1000}
    output-limit: ${CHAT_OUTPUT_LIMIT:2000}
    context-limit: ${CHAT_CONTEXT_LIMIT:80000}
    max-output-tokens: ${CHAT_MAX_OUTPUT_TOKENS:512}
    pricing-reference: ${CHAT_PRICING_REFERENCE:}
    input-usd-per-million: ${CHAT_INPUT_USD_PER_MILLION:}
    output-usd-per-million: ${CHAT_OUTPUT_USD_PER_MILLION:}
  admin-bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
